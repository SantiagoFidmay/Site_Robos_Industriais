<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="220" fill="url(#bg)" rx="8"/>
  
  <!-- PCB grid pattern -->
  <g stroke="#FF9800" stroke-opacity="0.08" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="220"/><line x1="20" y1="0" x2="20" y2="220"/><line x1="40" y1="0" x2="40" y2="220"/><line x1="60" y1="0" x2="60" y2="220"/><line x1="80" y1="0" x2="80" y2="220"/><line x1="100" y1="0" x2="100" y2="220"/><line x1="120" y1="0" x2="120" y2="220"/><line x1="140" y1="0" x2="140" y2="220"/><line x1="160" y1="0" x2="160" y2="220"/><line x1="180" y1="0" x2="180" y2="220"/><line x1="200" y1="0" x2="200" y2="220"/><line x1="220" y1="0" x2="220" y2="220"/><line x1="240" y1="0" x2="240" y2="220"/><line x1="260" y1="0" x2="260" y2="220"/><line x1="280" y1="0" x2="280" y2="220"/><line x1="300" y1="0" x2="300" y2="220"/>
    <line x1="0" y1="0" x2="300" y2="0"/><line x1="0" y1="20" x2="300" y2="20"/><line x1="0" y1="40" x2="300" y2="40"/><line x1="0" y1="60" x2="300" y2="60"/><line x1="0" y1="80" x2="300" y2="80"/><line x1="0" y1="100" x2="300" y2="100"/><line x1="0" y1="120" x2="300" y2="120"/><line x1="0" y1="140" x2="300" y2="140"/><line x1="0" y1="160" x2="300" y2="160"/><line x1="0" y1="180" x2="300" y2="180"/><line x1="0" y1="200" x2="300" y2="200"/><line x1="0" y1="220" x2="300" y2="220"/>
  </g>
  
  <!-- Chip body -->
  <rect x="90" y="55" width="120" height="90" rx="6" fill="url(#chip)" stroke="#FF9800" stroke-width="2" stroke-opacity="0.9"/>
  
  <!-- Chip shine -->
  <rect x="94" y="59" width="112" height="40" rx="4" fill="white" fill-opacity="0.05"/>
  
  <!-- Chip label -->
  <text x="150" y="106" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="white" fill-opacity="0.95">BH1750</text>
  
  <!-- Chip pins left -->
  <rect x="72" y="70" width="18" height="8" rx="2" fill="#FF9800" fill-opacity="0.8"/><rect x="72" y="88" width="18" height="8" rx="2" fill="#FF9800" fill-opacity="0.8"/><rect x="72" y="106" width="18" height="8" rx="2" fill="#FF9800" fill-opacity="0.8"/><rect x="72" y="124" width="18" height="8" rx="2" fill="#FF9800" fill-opacity="0.8"/>
  
  <!-- Chip pins right -->
  <rect x="210" y="70" width="18" height="8" rx="2" fill="#FF9800" fill-opacity="0.8"/><rect x="210" y="88" width="18" height="8" rx="2" fill="#FF9800" fill-opacity="0.8"/><rect x="210" y="106" width="18" height="8" rx="2" fill="#FF9800" fill-opacity="0.8"/><rect x="210" y="124" width="18" height="8" rx="2" fill="#FF9800" fill-opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="60" y1="74" x2="72" y2="74" stroke="#FF9800" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="60" y1="92" x2="72" y2="92" stroke="#FF9800" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="228" y1="74" x2="240" y2="74" stroke="#FF9800" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="228" y1="92" x2="240" y2="92" stroke="#FF9800" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Solder pads -->
  <circle cx="60" cy="175" r="5" fill="#FF9800" fill-opacity="0.7" stroke="#FF9800" stroke-width="1"/><circle cx="105" cy="175" r="5" fill="#FF9800" fill-opacity="0.7" stroke="#FF9800" stroke-width="1"/><circle cx="150" cy="175" r="5" fill="#FF9800" fill-opacity="0.7" stroke="#FF9800" stroke-width="1"/><circle cx="195" cy="175" r="5" fill="#FF9800" fill-opacity="0.7" stroke="#FF9800" stroke-width="1"/><circle cx="240" cy="175" r="5" fill="#FF9800" fill-opacity="0.7" stroke="#FF9800" stroke-width="1"/>
  <line x1="60" y1="170" x2="60" y2="155" stroke="#FF9800" stroke-width="1" stroke-opacity="0.4"/><line x1="105" y1="170" x2="105" y2="155" stroke="#FF9800" stroke-width="1" stroke-opacity="0.4"/><line x1="150" y1="170" x2="150" y2="155" stroke="#FF9800" stroke-width="1" stroke-opacity="0.4"/><line x1="195" y1="170" x2="195" y2="155" stroke="#FF9800" stroke-width="1" stroke-opacity="0.4"/><line x1="240" y1="170" x2="240" y2="155" stroke="#FF9800" stroke-width="1" stroke-opacity="0.4"/>
  
  <!-- Icon -->
  <text x="245" y="165" font-size="28" text-anchor="middle">☀️</text>
  
  <!-- Glow effect -->
  <ellipse cx="150" cy="100" rx="70" ry="50" fill="#FF9800" fill-opacity="0.05"/>
</svg>